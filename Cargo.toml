[package]
name = "type-along"
version = "0.1.0"
edition = "2024"
description = "Terminal typing practice using your own files as the source text"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dstanek/type-along"
readme = "README.md"
keywords = ["typing", "practice", "terminal", "tui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
syntect = { version = "5.1", default-features = false, features = ["default-fancy"] }
anyhow = "1.0"

[dev-dependencies]
portable-pty = "0.9.0"
